<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 76" width="264" height="76">
  <defs>
    <!-- 24K Royal Gold Gradient -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="20%" stop-color="#FDE073" />
      <stop offset="48%" stop-color="#E8A317" />
      <stop offset="78%" stop-color="#C27A06" />
      <stop offset="100%" stop-color="#7A4800" />
    </linearGradient>

    <!-- Gloss White Platinum Gradient -->
    <linearGradient id="whiteGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Coin Outer Rim Bevel Gradient -->
    <linearGradient id="coinRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DE" />
      <stop offset="35%" stop-color="#F6C543" />
      <stop offset="70%" stop-color="#B26C04" />
      <stop offset="100%" stop-color="#4E2B00" />
    </linearGradient>

    <!-- Badge Inner Radial Texture -->
    <radialGradient id="badgeRadial" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0F4724" />
      <stop offset="65%" stop-color="#052110" />
      <stop offset="100%" stop-color="#010D06" />
    </radialGradient>

    <!-- Plaque Background Gradient -->
    <linearGradient id="plaqueBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02160A" />
      <stop offset="50%" stop-color="#08381A" />
      <stop offset="100%" stop-color="#02160A" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow3D" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== LEFT: ROYAL CREST COIN ==================== -->
  <g transform="translate(4, 3)" filter="url(#shadow3D)">
    <!-- Outer Beveled Gold Coin Rim -->
    <circle cx="35" cy="35" r="34" fill="url(#coinRim)" />
    <!-- Dark Inset Channel -->
    <circle cx="35" cy="35" r="31.5" fill="#010A04" />
    <!-- Inner Radiant Emerald Coin Face -->
    <circle cx="35" cy="35" r="29.5" fill="url(#badgeRadial)" />
    
    <!-- Precision Beaded Ring -->
    <circle cx="35" cy="35" r="26.5" fill="none" stroke="url(#goldSheen)" stroke-width="1.2" stroke-dasharray="2.8, 2.2" opacity="0.9" />

    <!-- 5-Point Imperial Crown with Ruby & Diamonds -->
    <g transform="translate(35, 18)">
      <!-- Crown Base -->
      <path d="M-13 10 L-9 1 L-3 7 L0 0 L3 7 L9 1 L13 10 Z" fill="url(#goldSheen)" filter="url(#softGlow)" />
      <rect x="-13" y="9.5" width="26" height="2.5" rx="0.8" fill="#FFF3BE" />
      <!-- Gems -->
      <circle cx="-9" cy="1" r="1.3" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="1.8" fill="#FF3B30" />
      <circle cx="9" cy="1" r="1.3" fill="#FFFFFF" />
    </g>

    <!-- BPA Monogram in Crest -->
    <text x="35" y="44.5" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="950" fill="url(#goldSheen)" text-anchor="middle" letter-spacing="0.8">BPA</text>
    
    <!-- BD Mini Badge -->
    <rect x="22" y="49.5" width="26" height="10.5" rx="3" fill="#021307" stroke="url(#goldSheen)" stroke-width="0.8" />
    <text x="35" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#FFF2BD" text-anchor="middle" letter-spacing="1">BD</text>
  </g>

  <!-- ==================== RIGHT: BRAND TYPOGRAPHY ==================== -->
  <g transform="translate(84, 8)">
    <!-- Main Title: Bpa-Bd with Dynamic Athletic Slant & 3D Shadow -->
    <g transform="skewX(-7)" filter="url(#shadow3D)">
      <text x="0" y="34" font-family="system-ui, -apple-system, 'Montserrat', sans-serif" font-size="36" font-weight="950" letter-spacing="-0.5">
        <!-- Bpa in Glossy Platinum White -->
        <tspan fill="url(#whiteGloss)">Bpa</tspan>
        <!-- Hyphen in Gold -->
        <tspan fill="url(#goldSheen)" dx="1">-</tspan>
        <!-- Bd in 24K Specular Gold -->
        <tspan fill="url(#goldSheen)" dx="1" filter="url(#softGlow)">Bd</tspan>
      </text>
    </g>

    <!-- Subtitle Plaque: RAZ AGENCY with Gold Borders & Diamond Badges -->
    <g transform="translate(0, 42)" filter="url(#shadow3D)">
      <!-- Outer Plaque Shape with clipped corners -->
      <rect x="0" y="0" width="168" height="19" rx="4" fill="url(#plaqueBg)" stroke="url(#goldSheen)" stroke-width="1.1" />
      <!-- Gold Top Pin-stripe -->
      <line x1="10" y1="2" x2="158" y2="2" stroke="url(#goldSheen)" stroke-width="0.6" opacity="0.6" />
      <!-- Star / Diamond Accents & Agency Text -->
      <text x="84" y="13.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#FFF2BC" text-anchor="middle" letter-spacing="2.2">
        <tspan fill="url(#goldSheen)">★ </tspan>RAZ AGENCY<tspan fill="url(#goldSheen)"> ★</tspan>
      </text>
    </g>
  </g>
</svg>
